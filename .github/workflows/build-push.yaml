name: build-push

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build-push.yaml
      - scripts/test-image-workflow.sh
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-push.yaml
      - scripts/test-image-workflow.sh

permissions:
  contents: read

jobs:
  image-check:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build native image without credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.architecture.platform }}
          provenance: false
          push: false
          tags: terraform-linux-packages:ci-${{ matrix.architecture.suffix }}

  run:
    if: github.ref == 'refs/heads/main'
    uses: libops/.github/.github/workflows/build-push.yaml@main
    with:
      ref: ${{ github.sha }}
      expected-main-sha: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
      sign: true
    permissions:
      contents: read
      packages: write
      id-token: write
