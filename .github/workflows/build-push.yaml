name: build-push

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build-push.yaml
      - scripts/test-image-workflow.sh
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/build-push.yaml
      - scripts/test-image-workflow.sh

permissions:
  contents: read

jobs:
  image-check:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build native image without credentials
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.architecture.platform }}
          provenance: false
          push: false
          tags: terraform-linux-packages:ci-${{ matrix.architecture.suffix }}

  run:
    if: github.ref == 'refs/heads/main'
    uses: libops/.github/.github/workflows/build-push.yaml@main
    with:
      ref: ${{ github.sha }}
      expected-main-sha: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
      sign: true
    permissions:
      contents: read
      packages: write
      id-token: write
